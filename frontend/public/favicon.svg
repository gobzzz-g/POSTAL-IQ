<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA1E28" />
      <stop offset="100%" stop-color="#7A1016" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <!-- Inner Border for subtle polish -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
  <!-- PostalIQ Layers Emblem -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Top Layer (Solid filled for high visibility in small tabs) -->
    <path d="M32 14 L50.5 23.5 L32 33 L13.5 23.5 Z" fill="#FFFFFF" fill-opacity="0.22" />
    <!-- Middle Shelf -->
    <path d="M13.5 33.5 L32 43 L50.5 33.5" />
    <!-- Bottom Shelf -->
    <path d="M13.5 43.5 L32 53 L50.5 43.5" />
  </g>
</svg>